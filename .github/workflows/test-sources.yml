name: Test data sources

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test each source
        run: |
          for u in \
            "https://zip.cm.edu.kg/all.json" \
            "https://[REDACTED]/zip.cm.edu.kg/all.json" \
            "https://proxy-cm-json.[REDACTED]/all.json"; do
            echo "=== $u ==="
            curl -skL -m 60 -A "Mozilla/5.0" -o /tmp/t.json -w "HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" "$u" || echo "curl failed"
            head -c 60 /tmp/t.json | head -1
            echo
          done
