name: Debug Proxy

# 臨時診斷 workflow — 用完即刪
on:
  push:
    paths:
      - '.github/workflows/_debug-proxy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe all sources from Actions runner
        env:
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PROXY_URL: ${{ vars.PROXY_URL }}
          PROXY_URL_2: ${{ vars.PROXY_URL_2 }}
        run: |
          UP="https://zip.cm.edu.kg/all.json"
          {
            echo "run_at=$(date -u +%FT%TZ)"
            echo "PROXY_URL=${PROXY_URL:-<EMPTY>}"
            echo "PROXY_URL_2=${PROXY_URL_2:-<EMPTY>}"
            echo "PROXY_TOKEN_len=${#PROXY_TOKEN}"
            echo "---"
            for pair in "main|$PROXY_URL" "backup|$PROXY_URL_2" "yx1|https://yx1.rjj.cc.cd/$UP" "upstream_direct|$UP"; do
              n="${pair%%|*}"; u="${pair#*|}"
              if [ -z "$u" ]; then echo "$n: <EMPTY URL>"; continue; fi
              rm -f /tmp/r.json
              code=$(curl -skL -m 60 -o /tmp/r.json -w "%{http_code}" -H "X-Auth-Token: $PROXY_TOKEN" -A "Mozilla/5.0" "$u" 2>/dev/null)
              rc=$?
              size=$(wc -c < /tmp/r.json 2>/dev/null || echo 0)
              echo "$n → HTTP=$code curl_rc=$rc size=$size"
              head -c 180 /tmp/r.json 2>/dev/null; echo
            done
          } > _debug_proxy.txt 2>&1
          cat _debug_proxy.txt

      - name: Commit probe result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _debug_proxy.txt
          git diff --staged --quiet && echo "no change" || git commit -m "debug: proxy probe result"
          git push origin main
