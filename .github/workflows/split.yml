name: Split by Region

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'   # 00:00 HKT
    - cron: '0 22 * * *'   # 06:00 HKT
    - cron: '0 4 * * *'    # 12:00 HKT
    - cron: '0 10 * * *'   # 18:00 HKT

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore all.json cache
        id: cache
        uses: actions/cache@v4
        with:
          path: all_new.json
          key: alljson-cache-v1

      - name: Download all.json
        env:
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PROXY_URL: ${{ vars.PROXY_URL }}
        run: |
          dl() { curl -skL -m 60 -A "Mozilla/5.0" -H "X-Auth-Token: $PROXY_TOKEN" -o all_new.json "$PROXY_URL" && [ -s all_new.json ] && head -c 20 all_new.json | grep -q '"'; }
          if dl; then
            echo "✓ Cloudflare Worker"
          else
            echo "⚠️ Worker 失敗，用 cache（如有）"
          fi
          head -c 100 all_new.json; echo

      - name: Validate and replace
        run: python3 validate.py

      - name: Split json by region + org
        run: python3 split_json.py

      - name: Update README
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 update_readme.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for dir in regions_json regions_json_*/; do
            [ -d "$dir" ] && git add "$dir"
          done
          git add README.md stats.json
          TOTAL=$(python3 -c "import json; d=json.load(open('stats.json')); print(sum(sum(v.values()) if isinstance(list(v.values())[0], int) else sum(sum(x.values()) for x in v.values()) for v in d.values() if v))")
          git diff --staged --quiet || git commit -m "Auto update $(date '+%Y-%m-%d %H:%M HKT') · ${TOTAL} entries"
          git push
