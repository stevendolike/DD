name: Split by Region

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'   # 00:00 HKT
    - cron: '0 22 * * *'   # 06:00 HKT
    - cron: '0 4 * * *'    # 12:00 HKT
    - cron: '0 10 * * *'   # 18:00 HKT

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore all.json cache
        id: cache
        uses: actions/cache@v4
        with:
          path: all_new.json
          key: alljson-cache-v1

      - name: Download all.json
        timeout-minutes: 40
        env:
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PROXY_URL: ${{ vars.PROXY_URL }}
          PROXY_URL_2: ${{ vars.PROXY_URL_2 }}
        run: |
          UP="https://zip.cm.edu.kg/all.json"
          # 清走任何殘留舊檔（cache restore / 上次 artifact），確保 ok() 只反映今次下載
          rm -f all_new.json
          # 有效數據 = 有 data 陣列、冇 error 欄位、有實際內容
          ok() { [ -s "$1" ] && grep -q '"data"' "$1" && ! grep -q '"error"' "$1" && [ "$(wc -c < "$1")" -gt 100000 ]; }

          # 帶重試 + 遞增 backoff 嘅下載（上游間歇性故障時救得返）
          fetch() {  # $1=url  $2=output  其餘參數原樣傳俾 curl
            url="$1"; out="$2"; shift 2
            n=1
            while [ "$n" -le 3 ]; do
              if curl -skL -m 90 -A "Mozilla/5.0" "$@" -o "$out" "$url" && ok "$out"; then
                return 0
              fi
              if [ "$n" -lt 3 ]; then
                echo "  ↻ 第 $n/3 次失敗，$((n * 10))s 後重試"
                sleep $((n * 10))
              fi
              n=$((n + 1))
            done
            return 1
          }

          # 一輪：① 主 proxy → ② 備 proxy → ③ 三個後備節點（每個源都帶 3 次重試）
          try_all() {
            # ① 主 proxy（Vercel Edge）
            if [ -n "$PROXY_URL" ]; then
              if fetch "$PROXY_URL" all_new.json -H "X-Auth-Token: $PROXY_TOKEN"; then
                echo "✓ 主 proxy（PROXY_URL）"; return 0
              fi
              echo "⚠️ 主 proxy（PROXY_URL）失敗（已重試 3 次）"
            fi
            # ② 備 proxy（Deno Deploy）
            if [ -n "$PROXY_URL_2" ]; then
              if fetch "$PROXY_URL_2" all_new.json -H "X-Auth-Token: $PROXY_TOKEN"; then
                echo "✓ 備 proxy（PROXY_URL_2）"; return 0
              fi
              echo "⚠️ 備 proxy（PROXY_URL_2）失敗（已重試 3 次）"
            fi
            # ③ 三個後備節點（Cloudflare，通常被上游擋）
            for P in yx1 yx2 yx3; do
              if fetch "https://$P.rjj.cc.cd/$UP" all_new.json; then
                echo "✓ 後備節點 $P.rjj.cc.cd"; return 0
              fi
              echo "⚠️ $P.rjj.cc.cd 失敗（已重試 3 次）"
            done
            return 1
          }

          # 首輪 → 失敗就等 60 秒做最後一輪（應付間歇性故障）
          if ! try_all; then
            echo "⏳ 首輪全敗 — 等 60 秒後做最後一輪"
            sleep 60
            try_all
          fi

          # ③ 全敗 → 中止（唔會改動現有 all.json，避免污染數據）
          if ! ok all_new.json; then
            echo "❌ 所有數據源（含重試）都攞唔到有效數據 — 中止 job（現有 all.json 保持不變）"
            [ -s all_new.json ] && head -c 300 all_new.json; echo
            exit 1
          fi
          echo "all_new.json: $(wc -c < all_new.json) bytes"
          head -c 120 all_new.json; echo

      - name: Validate and replace
        run: python3 validate.py

      - name: Split json by region + org
        run: python3 split_json.py

      - name: Update README
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 update_readme.py

      - name: Generate GitHub Pages site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 gen_pages.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add all.json
          for dir in regions_json regions_json_*/; do
            [ -d "$dir" ] && git add "$dir"
          done
          git add README.md stats.json
          [ -d docs ] && git add docs
          TOTAL=$(python3 -c "import json; d=json.load(open('stats.json')); print(sum(sum(v.values()) if isinstance(list(v.values())[0], int) else sum(sum(x.values()) for x in v.values()) for v in d.values() if v))")
          git diff --staged --quiet || git commit -m "Auto update $(date '+%Y-%m-%d %H:%M HKT') · ${TOTAL} entries"
          git push
