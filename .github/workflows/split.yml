name: Split by Region

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'   # 00:00 HKT
    - cron: '0 22 * * *'   # 06:00 HKT
    - cron: '0 4 * * *'    # 12:00 HKT
    - cron: '0 10 * * *'   # 18:00 HKT

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore all.json cache
        id: cache
        uses: actions/cache@v4
        with:
          path: all_new.json
          key: alljson-cache-v1

      - name: Download all.json
        env:
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PROXY_URL: ${{ vars.PROXY_URL }}
        run: |
          UP="https://zip.cm.edu.kg/all.json"
          # 有效數據 = 有 data 陣列、冇 error 欄位、有實際內容
          ok() { [ -s "$1" ] && grep -q '"data"' "$1" && ! grep -q '"error"' "$1" && [ "$(wc -c < "$1")" -gt 100000 ]; }
          FOUND=""

          # ① Cloudflare Worker（有 token 保護，正常路徑）
          if [ -n "$PROXY_URL" ] && curl -skL -m 90 -A "Mozilla/5.0" \
               -H "X-Auth-Token: $PROXY_TOKEN" -o all_new.json "$PROXY_URL" && ok all_new.json; then
            echo "✓ Cloudflare Worker"
            FOUND=1
          else
            echo "⚠️ Cloudflare Worker 失敗，試後備節點"
            # ② 三個後備節點（用法：/<完整上游 URL>）
            for P in yx1 yx2 yx3; do
              if curl -skL -m 90 -A "Mozilla/5.0" -o all_new.json "https://$P.rjj.cc.cd/$UP" && ok all_new.json; then
                echo "✓ 後備節點 $P.rjj.cc.cd"
                FOUND=1
                break
              fi
              echo "⚠️ $P.rjj.cc.cd 失敗"
            done
          fi

          # ③ 全敗 → 中止（唔會改動現有 all.json，避免污染數據）
          if [ -z "$FOUND" ]; then
            echo "❌ 所有數據源都攞唔到有效數據 — 中止 job（現有 all.json 保持不變）"
            [ -s all_new.json ] && head -c 300 all_new.json; echo
            exit 1
          fi
          echo "all_new.json: $(wc -c < all_new.json) bytes"
          head -c 120 all_new.json; echo

      - name: Validate and replace
        run: python3 validate.py

      - name: Split json by region + org
        run: python3 split_json.py

      - name: Update README
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 update_readme.py

      - name: Generate GitHub Pages site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 gen_pages.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add all.json
          for dir in regions_json regions_json_*/; do
            [ -d "$dir" ] && git add "$dir"
          done
          git add README.md stats.json
          [ -d docs ] && git add docs
          TOTAL=$(python3 -c "import json; d=json.load(open('stats.json')); print(sum(sum(v.values()) if isinstance(list(v.values())[0], int) else sum(sum(x.values()) for x in v.values()) for v in d.values() if v))")
          git diff --staged --quiet || git commit -m "Auto update $(date '+%Y-%m-%d %H:%M HKT') · ${TOTAL} entries"
          git push
