name: Split by Region

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'   # 00:00 HKT
    - cron: '0 22 * * *'   # 06:00 HKT
    - cron: '0 4 * * *'    # 12:00 HKT
    - cron: '0 10 * * *'   # 18:00 HKT

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore all.json cache
        id: cache
        uses: actions/cache@v4
        with:
          path: all_new.json
          key: alljson-cache-v1

      - name: Download all.json
        env:
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PROXY_URL: ${{ vars.PROXY_URL }}
        run: |
          dl() { curl -skL -m 60 -A "Mozilla/5.0" -H "X-Auth-Token: $PROXY_TOKEN" -o "$1" "$PROXY_URL" && [ -s "$1" ] && head -c 20 "$1" | grep -q '"'; }
          # 試 2 次（Worker 有 3 層 upstream 策略，可能第一次 timeout）
          for i in 1 2; do
            if dl all_new.json; then
              echo "✓ Cloudflare Worker（第 $i 次）"
              break
            fi
            echo "⚠️ Worker 第 $i 次失敗"
            sleep 5
          done
          # fallback：用 repo 內現有 all.json（checkout 已攞到），令 job 唔會因下載失敗而全紅
          if [ ! -s all_new.json ] || ! head -c 20 all_new.json | grep -q '"'; then
            echo "⚠️ Worker 攞唔到，改用 repo 內現有 all.json（數據唔會更新，但 job 唔會 fail）"
            cp all.json all_new.json
          fi
          echo "all_new.json: $(wc -c < all_new.json) bytes"
          head -c 120 all_new.json; echo

      - name: Validate and replace
        run: python3 validate.py

      - name: Split json by region + org
        run: python3 split_json.py

      - name: Update README
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 update_readme.py

      - name: Generate GitHub Pages site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 gen_pages.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add all.json
          for dir in regions_json regions_json_*/; do
            [ -d "$dir" ] && git add "$dir"
          done
          git add README.md stats.json
          [ -d docs ] && git add docs
          TOTAL=$(python3 -c "import json; d=json.load(open('stats.json')); print(sum(sum(v.values()) if isinstance(list(v.values())[0], int) else sum(sum(x.values()) for x in v.values()) for v in d.values() if v))")
          git diff --staged --quiet || git commit -m "Auto update $(date '+%Y-%m-%d %H:%M HKT') · ${TOTAL} entries"
          git push
